# Deploys deploy/main.bicep to Azure: on each push to main that changes it, and by hand (workflow_dispatch).
# The job "what-if" shows the changes in the summary of the run. The job "deploy" then waits for the approval of a
# required reviewer of the environment "azure-infra". Pull requests only check the Bicep file and the scripts.
# deploy/deploy.sh sets up Azure, the environments and the variables once (docs/betrieb.md).
name: Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'deploy/main.bicep'
      - 'deploy/bicep.sh'
      - '.github/workflows/infra.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:
    inputs:
      what-if:
        description: Only show the changes (what-if), do not deploy
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Check Bicep and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Build Bicep
        run: az bicep build --file deploy/main.bicep --stdout > /dev/null

      - name: ShellCheck
        run: shellcheck deploy/*.sh

  what-if:
    name: Show the changes (what-if)
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The OIDC subject is the environment. Only main may use it (deploy/deploy.sh sets the rule).
    environment: azure-infra-what-if

    permissions:
      contents: read
      id-token: write # login to Azure with OIDC, no secret in GitHub

    env:
      SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP: ${{ vars.AZURE_CONTAINER_APP }}
      NAME: ${{ vars.NAME }}
      ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      OPERATOR_ID: ${{ vars.OPERATOR_ID }}
      SQL_GROUP: ${{ vars.SQL_GROUP }}
      SQL_GROUP_ID: ${{ vars.SQL_GROUP_ID }}
      DOMAIN: ${{ vars.DOMAIN }}
      MAILBOX_HOST: ${{ vars.MAILBOX_HOST }}
      MAILBOX_USER: ${{ vars.MAILBOX_USER }}
      MAILBOX_ADDRESS: ${{ vars.MAILBOX_ADDRESS }}
      MONTHLY_BUDGET: ${{ vars.MONTHLY_BUDGET }}
      CULTURE: ${{ vars.CULTURE }}
      AZURE_INFRA_CLIENT_ID: ${{ vars.AZURE_INFRA_CLIENT_ID }}

    steps:
      - name: Check the variables
        run: |
          missing=0
          for variable in AZURE_INFRA_CLIENT_ID SUBSCRIPTION_ID RESOURCE_GROUP APP NAME ADMIN_EMAIL ALERT_EMAIL \
              OPERATOR_ID SQL_GROUP SQL_GROUP_ID MONTHLY_BUDGET CULTURE; do
            if [ -z "${!variable}" ]; then
              echo "::error::Variable $variable is missing. Run deploy/deploy.sh once (docs/betrieb.md)."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v7

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Keep the image that runs now: the pipeline sets new images, not this workflow.
      - name: Find the image
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          image=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP" \
            --query "properties.template.containers[0].image" -o tsv)
          echo "Image: $image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: What-if
        run: |
          source deploy/bicep.sh
          deploy_bicep true what-if > what-if.json
          {
            echo "## Änderungen in $RESOURCE_GROUP"
            echo "Image: \`$IMAGE\`"
            echo
            jq -r -f deploy/what-if.jq what-if.json
          } | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy infrastructure
    needs: what-if
    if: ${{ !inputs.what-if }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Waits for the approval of a required reviewer. Check the summary of the job "what-if" first.
    environment: azure-infra

    # Do not deploy the Bicep file and a new image at the same time.
    concurrency:
      group: azure-deploy
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write # login to Azure with OIDC, no secret in GitHub

    env:
      SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP: ${{ vars.AZURE_CONTAINER_APP }}
      NAME: ${{ vars.NAME }}
      ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      OPERATOR_ID: ${{ vars.OPERATOR_ID }}
      SQL_GROUP: ${{ vars.SQL_GROUP }}
      SQL_GROUP_ID: ${{ vars.SQL_GROUP_ID }}
      DOMAIN: ${{ vars.DOMAIN }}
      MAILBOX_HOST: ${{ vars.MAILBOX_HOST }}
      MAILBOX_USER: ${{ vars.MAILBOX_USER }}
      MAILBOX_ADDRESS: ${{ vars.MAILBOX_ADDRESS }}
      MONTHLY_BUDGET: ${{ vars.MONTHLY_BUDGET }}
      CULTURE: ${{ vars.CULTURE }}
      AZURE_INFRA_CLIENT_ID: ${{ vars.AZURE_INFRA_CLIENT_ID }}

    steps:
      - name: Check the variables
        run: |
          missing=0
          for variable in AZURE_INFRA_CLIENT_ID SUBSCRIPTION_ID RESOURCE_GROUP APP NAME ADMIN_EMAIL ALERT_EMAIL \
              OPERATOR_ID SQL_GROUP SQL_GROUP_ID MONTHLY_BUDGET CULTURE; do
            if [ -z "${!variable}" ]; then
              echo "::error::Variable $variable is missing. Run deploy/deploy.sh once (docs/betrieb.md)."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v7

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Keep the image that runs now: the pipeline sets new images, not this workflow.
      - name: Find the image
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          image=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP" \
            --query "properties.template.containers[0].image" -o tsv)
          echo "Image: $image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Deploy deploy/main.bicep
        run: |
          source deploy/bicep.sh
          deploy_bicep true > /dev/null
          echo "Deployed to $RESOURCE_GROUP"
