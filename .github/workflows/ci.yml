# Build and test on each push to main and on each pull request.
# No artifacts and no deployment: see "GitHub Actions" in AGENTS.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/Directory.Packages.props') }}

      - name: Restore
        run: dotnet restore src/Flowtr.slnx

      - name: Build
        run: dotnet build src/Flowtr.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/Flowtr.slnx --configuration Release --no-build
