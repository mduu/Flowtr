# Build and test on each push to main and on each pull request that changes the app.
# On main also: the job "build" publishes the image to the GitHub Container Registry, and the job "deploy" sets it on
# the app and the inbox job in Azure (story #011). The image is in the registry: no artifacts, see "GitHub Actions" in
# AGENTS.md. The job "deploy" runs only when deploy/deploy.sh set the variables.
name: CI

# Only changes that reach the app run the pipeline: not the specs, the docs, the infrastructure (workflow "Infrastructure")
# or the images of the repository. workflow_dispatch runs it always.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'specs/**'
      - 'docs/**'
      - 'deploy/**'
      - 'assets/**'
      - '**/*.md'
      - '.claude/**'
      - '.github/workflows/infra.yml'
  pull_request:
    paths-ignore:
      - 'specs/**'
      - 'docs/**'
      - 'deploy/**'
      - 'assets/**'
      - '**/*.md'
      - '.claude/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Do not stop a deployment in the middle.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      packages: write # image in the GitHub Container Registry

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/Directory.Packages.props') }}

      - name: Restore
        run: dotnet restore src/Flowtr.slnx

      - name: Build
        run: dotnet build src/Flowtr.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/Flowtr.slnx --configuration Release --no-build

      - name: Publish image
        if: env.PUBLISH == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          dotnet publish src/Flowtr.Server --configuration Release --no-restore /t:PublishContainer \
            -p ContainerRegistry=ghcr.io -p ContainerRepository="${GITHUB_REPOSITORY,,}" \
            -p ContainerImageTags="\"${GITHUB_SHA};latest\""

      - name: Delete old images
        if: env.PUBLISH == 'true'
        uses: actions/delete-package-versions@v5
        with:
          package-name: flowtr
          package-type: container
          min-versions-to-keep: 10

  deploy:
    name: Deploy to Azure
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Do not set a new image while the workflow "Infrastructure" deploys.
    concurrency:
      group: azure-deploy
      cancel-in-progress: false

    permissions:
      id-token: write # login to Azure with OIDC, no secret in GitHub

    steps:
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set the image on the app and the inbox job
        env:
          GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINER_APP }}
          JOB: ${{ vars.AZURE_INBOX_JOB }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          az containerapp update --resource-group "$GROUP" --name "$APP" --image "$image" -o none
          if [ -n "$JOB" ]; then
            az containerapp job update --resource-group "$GROUP" --name "$JOB" --image "$image" -o none
          fi

          # The new revision is ready. Then a request to the API wakes the database: Flowtr applies the migrations.
          # /status alone does not wake it (story #011). The API answers 401, which is correct.
          for _ in $(seq 1 60); do
            state=$(az containerapp show --resource-group "$GROUP" --name "$APP" \
              --query "properties.latestRevisionName == properties.latestReadyRevisionName" -o tsv)
            [ "$state" = "true" ] && break
            sleep 5
          done
          curl -sS -o /dev/null --max-time 10 "$APP_URL/api/business" || true
          for _ in $(seq 1 60); do
            if curl -fsS "$APP_URL/status" | grep -q '"ready":true'; then
              echo "Flowtr is ready: $APP_URL"
              exit 0
            fi
            sleep 5
          done
          echo "Flowtr did not get ready in 5 minutes" >&2
          exit 1
